[pytest]
# Contract fuzzing (Schemathesis) — config mínima.
# La colección (--collect-only) NO pega al backend; la ejecución real es OPT-IN
# y requiere credenciales + luz verde del QA Lead (ver README.md y docs/SCOPE.md).
testpaths = test_contract.py
python_files = test_contract.py
addopts = -ra

markers =
    contract: contract fuzzing de una operación del OpenAPI spec (Schemathesis).
